<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Você decide o futuro da IA</title>
<style>
  :root{
    --bg: #0b1220;
    --card: #141d31;
    --card-border: #223050;
    --text: #e7ecf5;
    --muted: #9fb0c9;
    --option: #1c2740;
    --option-border: #2b3a5c;
    --option-hover: #24406b;
    --accent-a: #34e0d0;
    --accent-b: #4c8dff;
    --accent-c: #8b6bff;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background: radial-gradient(1200px 700px at 50% -10%, #16223e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }

  .stage{
    width: 100%;
    max-width: 720px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 48px 44px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card::before{
    content: "";
    position: absolute;
    top: -60%;
    left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 220px;
    background: radial-gradient(closest-side, rgba(76,141,255,0.18), transparent 70%);
    pointer-events: none;
  }

  .progress{
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .progress span{
    width: 26px;
    height: 4px;
    border-radius: 2px;
    background: var(--option-border);
    transition: background 0.3s ease;
  }

  .progress span.done{
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
  }

  h1{
    text-align: center;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    margin: 0 0 22px;
    font-weight: 700;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b) 55%, var(--accent-c));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.story{
    text-align: center;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.65;
    max-width: 560px;
    margin: 0 auto 30px;
  }

  .options{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button.option{
    font-family: inherit;
    font-size: 0.98rem;
    color: var(--text);
    background: var(--option);
    border: 1px solid var(--option-border);
    border-radius: 10px;
    padding: 16px 20px;
    cursor: pointer;
    text-align: center;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
  }

  button.option:hover{
    background: var(--option-hover);
    border-color: var(--accent-b);
  }

  button.option:active{
    transform: scale(0.99);
  }

  .start-row{
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }

  button.start{
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--bg);
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    border: none;
    border-radius: 999px;
    padding: 13px 40px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.12s ease;
  }

  button.start:hover{
    filter: brightness(1.08);
  }

  button.start:active{
    transform: scale(0.98);
  }

  .ending-tag{
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.4px;
    color: var(--accent-a);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .restart-row{
    display: flex;
    justify-content: center;
    margin-top: 8px;
  }

  button.restart{
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--option-border);
    border-radius: 999px;
    padding: 10px 24px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  button.restart:hover{
    color: var(--text);
    border-color: var(--accent-b);
  }

  footer{
    text-align: center;
    color: #4d5b78;
    font-size: 0.78rem;
    margin-top: 22px;
  }

  @media (max-width: 480px){
    .card{ padding: 36px 24px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="card" id="card"></div>
    <footer>Um jogo de decisões sobre Inteligência Artificial</footer>
  </div>

<script>
  // Estrutura da história: cada nó tem um texto e uma lista de opções.
  // Cada opção leva ao id do próximo nó (ou null quando é um final).
  const historia = {
    inicio: {
      titulo: "Você decide o futuro da IA",
      texto: "Amanda acabou de terminar o ensino médio quando um novo tipo de tecnologia toma conta do seu dia a dia: um assistente capaz de conversar, criar imagens e responder quase qualquer pergunta em segundos. O mundo ao redor dela está mudando rápido, e cada escolha que ela fizer vai definir que tipo de futuro quer construir com essa ferramenta.",
      opcoes: [
        { texto: "Iniciar", proximo: "primeiro_contato", isStart: true }
      ]
    },
    primeiro_contato: {
      texto: "No primeiro dia usando a IA, Amanda percebe o quanto ela é rápida e versátil. Qual é o primeiro pensamento dela?",
      opcoes: [
        { texto: "Isso é um pouco assustador...", proximo: "cautelosa" },
        { texto: "Isso é incrível, quero aprender tudo!", proximo: "empolgada" }
      ]
    },
    cautelosa: {
      texto: "Amanda decide ir com calma, testando a IA aos poucos e sempre checando se as respostas fazem sentido antes de confiar nelas.",
      opcoes: [
        { texto: "Usar a IA só para tarefas simples", proximo: "uso_simples" },
        { texto: "Pesquisar mais sobre como a IA funciona por trás", proximo: "estudo" }
      ]
    },
    empolgada: {
      texto: "Animada com as possibilidades, Amanda começa a usar a IA para tudo: estudos, projetos pessoais e até para conversar sobre ideias novas.",
      opcoes: [
        { texto: "Usar a IA para acelerar um trabalho da escola", proximo: "trabalho_escola" },
        { texto: "Criar um projeto próprio com ajuda da IA", proximo: "projeto_proprio" }
      ]
    },
    uso_simples: {
      texto: "Com um uso equilibrado, Amanda aprende a usar a IA como uma ferramenta de apoio, sem depender dela para pensar por si mesma.",
      opcoes: [
        { texto: "Ver o final da história", proximo: "final_equilibrio" }
      ]
    },
    estudo: {
      texto: "Amanda mergulha em vídeos e artigos sobre como os modelos de IA são treinados, e passa a entender tanto o potencial quanto os limites da tecnologia.",
      opcoes: [
        { texto: "Ver o final da história", proximo: "final_conhecimento" }
      ]
    },
    trabalho_escola: {
      texto: "A professora pede um trabalho sobre o uso de IA em sala de aula. Amanda usa a IA para buscar informações, mas reescreve tudo com as próprias palavras antes de entregar.",
      opcoes: [
        { texto: "Ver o final da história", proximo: "final_criativo" }
      ]
    },
    projeto_proprio: {
      texto: "Amanda usa a IA como parceira de brainstorm para criar seu próprio joguinho de decisões — bem parecido com esta história que você acabou de jogar.",
      opcoes: [
        { texto: "Ver o final da história", proximo: "final_criador" }
      ]
    },
    final_equilibrio: {
      tag: "Final: Equilíbrio",
      texto: "Amanda descobre que a IA funciona melhor como uma aliada, não como uma substituta do próprio raciocínio. Ela segue estudando, questionando e usando a tecnologia com consciência.",
      opcoes: []
    },
    final_conhecimento: {
      tag: "Final: Conhecimento",
      texto: "Entender como a IA funciona por dentro muda a forma como Amanda enxerga a tecnologia. Ela passa a confiar nas próprias análises tanto quanto nas respostas da máquina.",
      opcoes: []
    },
    final_criativo: {
      tag: "Final: Criatividade",
      texto: "O trabalho de Amanda é elogiado pela professora, que destaca como ela usou a IA como ponto de partida, mas manteve a própria voz no resultado final.",
      opcoes: []
    },
    final_criador: {
      tag: "Final: Criadora",
      texto: "Amanda percebe que pode ir além de usar IA — ela também pode criar com tecnologia. Esse projeto se torna o primeiro de muitos que ela vai construir daqui para frente.",
      opcoes: []
    }
  };

  const card = document.getElementById("card");
  const ordemProgresso = ["inicio", "primeiro_contato", "escolha2", "final"];

  function renderizar(idNo) {
    const no = historia[idNo];
    card.innerHTML = "";

    // barra de progresso simples (3 passos: início > escolha > final)
    const passos = idNo === "inicio" ? 0
      : no.opcoes.length > 0 && !no.tag ? (idNo === "primeiro_contato" ? 1 : 2)
      : 3;

    const progresso = document.createElement("div");
    progresso.className = "progress";
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("span");
      if (i < passos) dot.classList.add("done");
      progresso.appendChild(dot);
    }
    card.appendChild(progresso);

    if (no.tag) {
      const tag = document.createElement("div");
      tag.className = "ending-tag";
      tag.textContent = no.tag;
      card.appendChild(tag);
    }

    if (no.titulo) {
      const h1 = document.createElement("h1");
      h1.textContent = no.titulo;
      card.appendChild(h1);
    }

    const texto = document.createElement("p");
    texto.className = "story";
    texto.textContent = no.texto;
    card.appendChild(texto);

    if (no.opcoes.some(o => o.isStart)) {
      const row = document.createElement("div");
      row.className = "start-row";
      for (const opcao of no.opcoes) {
        const btn = document.createElement("button");
        btn.className = "start";
        btn.textContent = opcao.texto;
        btn.addEventListener("click", () => renderizar(opcao.proximo));
        row.appendChild(btn);
      }
      card.appendChild(row);
    } else if (no.opcoes.length > 0) {
      const opts = document.createElement("div");
      opts.className = "options";
      for (const opcao of no.opcoes) {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = opcao.texto;
        btn.addEventListener("click", () => renderizar(opcao.proximo));
        opts.appendChild(btn);
      }
      card.appendChild(opts);
    } else {
      const row = document.createElement("div");
      row.className = "restart-row";
      const btn = document.createElement("button");
      btn.className = "restart";
      btn.textContent = "Jogar novamente";
      btn.addEventListener("click", () => renderizar("inicio"));
      row.appendChild(btn);
      card.appendChild(row);
    }
  }

  renderizar("inicio");
</script>

</body>
</html>
